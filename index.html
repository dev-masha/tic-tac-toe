<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Tic Tac Toe</h1>
  <p id="turn">Player X's Turn</p>

  <div class="board">
    <div class="cell" i="0"></div>
    <div class="cell" i="1"></div>
    <div class="cell" i="2"></div>
    <div class="cell" i="3"></div>
    <div class="cell" i="4"></div>
    <div class="cell" i="5"></div>
    <div class="cell" i="6"></div>
    <div class="cell" i="7"></div>
    <div class="cell" i="8"></div>
  </div>

  <button onclick="resetGame()">Reset</button>

  <script src="script.js"></script>
</body>
</html>
